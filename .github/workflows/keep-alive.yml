name: Keep Supabase project active

# Supabase free-tier projects pause after 7 days of low activity. This pings
# the REST API twice a week (well under that threshold) with a trivial read
# so the project never sits idle long enough to trigger a pause.

on:
  schedule:
    - cron: "0 8 * * 1,4" # Monday and Thursday, 08:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl --fail --silent --show-error \
            "${VITE_SUPABASE_URL}/rest/v1/rooms?select=id&limit=1" \
            -H "apikey: ${VITE_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${VITE_SUPABASE_ANON_KEY}" \
            -o /dev/null
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
