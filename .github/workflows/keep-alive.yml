name: Keep Supabase project active

# Supabase free-tier projects pause after 7 days of low activity. Their own docs say
# "a few user requests to the database each day over the previous week" is what keeps a
# project from being paused. A single daily ping still triggered an inactivity warning,
# so "a few" apparently means more than one — ping several times a day instead.

on:
  schedule:
    - cron: "0 6,12,18 * * *" # three times a day, 06:00/12:00/18:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl --fail --silent --show-error \
            "${VITE_SUPABASE_URL}/rest/v1/rooms?select=id&limit=1" \
            -H "apikey: ${VITE_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${VITE_SUPABASE_ANON_KEY}" \
            -o /dev/null
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
