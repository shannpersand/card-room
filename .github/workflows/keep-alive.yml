name: Keep Supabase project active

# Supabase free-tier projects pause after 7 days of low activity. Their own docs say
# "a few user requests to the database each day over the previous week" is what keeps a
# project from being paused — a twice-weekly ping (the original schedule here) does NOT
# satisfy that and the project got paused anyway despite every ping succeeding. Ping daily
# instead so there's no multi-day gap in activity.

on:
  schedule:
    - cron: "0 8 * * *" # every day, 08:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl --fail --silent --show-error \
            "${VITE_SUPABASE_URL}/rest/v1/rooms?select=id&limit=1" \
            -H "apikey: ${VITE_SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${VITE_SUPABASE_ANON_KEY}" \
            -o /dev/null
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
